<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 64" width="400" height="64" role="img" aria-labelledby="t">
  <title id="t">founding-agents</title>
  <!-- The mark with the wordmark. The wordmark is live text in the viewer's monospace face
       (the same stack the site uses), so it is not pixel-identical everywhere; the mark is. -->
  <style>
    .founder{fill:#14130E}
    .agent{fill:#1F5D3F}
    .word{fill:#14130E;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-weight:600;font-size:34px;letter-spacing:-0.3px}
    @media (prefers-color-scheme: dark){
      .founder,.word{fill:#FBF9F4}
      .agent{fill:#6FB98C}
    }
  </style>
  <rect class="founder" x="0" y="23" width="41" height="41" rx="1.5"/>
  <rect class="agent" x="0"  y="0"  width="18" height="18" rx="1.5"/>
  <rect class="agent" x="23" y="0"  width="18" height="18" rx="1.5"/>
  <rect class="agent" x="46" y="0"  width="18" height="18" rx="1.5"/>
  <rect class="agent" x="46" y="23" width="18" height="18" rx="1.5"/>
  <rect class="agent" x="46" y="46" width="18" height="18" rx="1.5"/>
  <text class="word" x="82" y="43">founding<tspan class="agent">-</tspan>agents</text>
</svg>
