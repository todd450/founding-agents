<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Founding Agents</title>
  <!-- One founder (the big block, the foundation) and five agents built up from it.
       Colours are the site's tokens: ink and green on paper; paper and a lighter green on ink. -->
  <style>
    .founder{fill:#14130E}
    .agent{fill:#1F5D3F}
    @media (prefers-color-scheme: dark){
      .founder{fill:#FBF9F4}
      .agent{fill:#6FB98C}
    }
  </style>
  <rect class="founder" x="0" y="23" width="41" height="41" rx="1.5"/>
  <rect class="agent" x="0"  y="0"  width="18" height="18" rx="1.5"/>
  <rect class="agent" x="23" y="0"  width="18" height="18" rx="1.5"/>
  <rect class="agent" x="46" y="0"  width="18" height="18" rx="1.5"/>
  <rect class="agent" x="46" y="23" width="18" height="18" rx="1.5"/>
  <rect class="agent" x="46" y="46" width="18" height="18" rx="1.5"/>
</svg>
